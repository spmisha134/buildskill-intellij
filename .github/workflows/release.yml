# Marketplace publishing is intentionally disabled. Releases are uploaded to JetBrains
# Marketplace manually from the locally built ZIP.

name: Release (manual publishing only)
on:
  workflow_dispatch:

jobs:

  # Retained as a disabled record of the former release automation. Do not enable
  # this job unless Marketplace publishing is explicitly re-approved.
  release:
    name: Marketplace publishing disabled
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled workflow
        run: echo "Marketplace publishing is disabled; upload the distribution manually."
